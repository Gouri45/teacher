<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root{
    --mint:#2dd4a7;
    --mint-dark:#1fae87;
    --bg-dark:#0d1117;
    --bg-card:#151b23;
  }
  body{
    background:var(--bg-dark);
    color:#e6edf3;
    font-family:'Segoe UI',sans-serif;
    overflow-x:hidden;
    cursor:none;
  }
  #bg-canvas{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;
    pointer-events:none;
  }
  .navbar{
    position:relative;z-index:2;background:transparent !important;
  }
  .navbar-brand, .nav-link{
    color:#e6edf3 !important;
    font-weight:500;
  }
  .nav-link:hover{ color:var(--mint) !important; }
  .btn-mint{
    background:var(--mint);
    border:none;
    color:#04140f;
    font-weight:600;
    padding:.6rem 1.6rem;
    border-radius:8px;
  }
  .btn-mint:hover{ background:var(--mint-dark); color:#04140f; }
  .btn-outline-mint{
    border:1px solid var(--mint);
    color:var(--mint);
    padding:.55rem 1.5rem;
    border-radius:8px;
  }
  .btn-outline-mint:hover{ background:var(--mint); color:#04140f; }
  .hero{
    position:relative;z-index:1;
    min-height:88vh;
    display:flex;
    align-items:center;
  }
  .hero h1{
    font-size:3.2rem;
    font-weight:800;
    line-height:1.1;
  }
  .hero h1 span{ color:var(--mint); }
  .hero p{
    color:#9fb0bd;
    font-size:1.1rem;
    max-width:480px;
  }
  .stat-pill{
    background:var(--bg-card);
    border:1px solid #24303a;
    border-radius:12px;
    padding:1rem 1.4rem;
  }
  .teacher-illustration{
    width:100%;
    max-width:420px;
  }

  /* Cursor trail effect */
  .cursor-dot{
    position:fixed;
    top:0;left:0;
    width:10px;height:10px;
    background:var(--mint);
    border-radius:50%;
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%);
    box-shadow:0 0 8px var(--mint);
    will-change:transform;
  }
  .trail{
    position:fixed;
    top:0;left:0;
    width:6px;height:6px;
    background:var(--mint);
    border-radius:50%;
    pointer-events:none;
    z-index:9998;
    opacity:.6;
    transform:translate(-50%,-50%);
    will-change:transform, opacity;
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="cursor-dot" id="cursorDot"></div>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home') }}"><i class="bi bi-mortarboard-fill" style="color:var(--mint)"></i> Teacher Portal</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('details') }}">View Teachers</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('add_teacher') }}">Add Teacher</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container hero">
  <div class="row align-items-center w-100">
    <div class="col-lg-6">
      <h1>Manage Your <span>Teachers</span> With Ease</h1>
      <p class="my-4">A simple, modern portal to register, update, and track faculty records — complete with live analytics and department insights.</p>
      <div class="d-flex gap-3 mb-4">
        <a href="{{ url_for('add_teacher') }}" class="btn btn-mint"><i class="bi bi-plus-circle me-1"></i> Add Teacher</a>
        <a href="{{ url_for('details') }}" class="btn btn-outline-mint">View Records</a>
      </div>
      <div class="stat-pill d-inline-flex align-items-center gap-2">
        <i class="bi bi-people-fill" style="color:var(--mint);font-size:1.4rem"></i>
        <div>
          <div class="fw-bold fs-4">{{ total }}</div>
          <div class="small text-secondary">Registered Teachers</div>
        </div>
      </div>
    </div>
    <div class="col-lg-6 text-center">
      <svg class="teacher-illustration" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <circle cx="200" cy="200" r="160" fill="#151b23" stroke="#2dd4a7" stroke-width="2" opacity="0.5"/>
        <circle cx="200" cy="140" r="55" fill="#2dd4a7"/>
        <rect x="120" y="210" width="160" height="130" rx="30" fill="#1fae87"/>
        <rect x="150" y="240" width="100" height="12" rx="6" fill="#0d1117"/>
        <rect x="150" y="265" width="70" height="12" rx="6" fill="#0d1117"/>
        <rect x="60" y="330" width="280" height="14" rx="7" fill="#24303a"/>
      </svg>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // Three.js particle background
  if (typeof THREE !== 'undefined') {
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.z = 300;

    const particleCount = 250;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 800;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({ color: 0x2dd4a7, size: 2, transparent: true, opacity: 0.6 });
    const points = new THREE.Points(geometry, material);
    scene.add(points);

    function animate() {
      requestAnimationFrame(animate);
      points.rotation.y += 0.0008;
      points.rotation.x += 0.0003;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  // Custom cursor trail effect
  const dot = document.getElementById('cursorDot');
  let lastTrailTime = 0;

  document.addEventListener('mousemove', (e) => {
    dot.style.left = e.clientX + 'px';
    dot.style.top = e.clientY + 'px';

    // Throttle trail dot creation for smoother performance
    const now = Date.now();
    if (now - lastTrailTime < 25) return;
    lastTrailTime = now;

    const trail = document.createElement('div');
    trail.className = 'trail';
    trail.style.left = e.clientX + 'px';
    trail.style.top = e.clientY + 'px';
    document.body.appendChild(trail);

    requestAnimationFrame(() => {
      trail.style.transition = 'opacity .5s ease, transform .5s ease';
      trail.style.opacity = '0';
      trail.style.transform = 'translate(-50%,-50%) scale(0.2)';
    });

    setTimeout(() => trail.remove(), 550);
  });

  // Hide the custom cursor if the mouse leaves the window
  document.addEventListener('mouseleave', () => { dot.style.opacity = '0'; });
  document.addEventListener('mouseenter', () => { dot.style.opacity = '1'; });
</script>
</body>
</html>
