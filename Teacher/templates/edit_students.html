{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card card-custom p-4">
            <h3 class="card-title text-warning mb-4"><i class="fa-solid fa-user-pen me-2"></i>Edit Teacher Information (ID: {{ teacher['id'] }})</h3>
            <form action="{{ url_for('edit_teacher', id=teacher['id']) }}" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ teacher['name'] }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" value="{{ teacher['email'] }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="text" name="phone" class="form-control" value="{{ teacher['phone'] }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Gender</label>
                        <select name="gender" class="form-select" required>
                            <option value="Male" {% if teacher['gender'] == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if teacher['gender'] == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if teacher['gender'] == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Department</label>
                        <input type="text" name="department" class="form-control" value="{{ teacher['department'] }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Qualification</label>
                        <input type="text" name="qualification" class="form-control" value="{{ teacher['qualification'] }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Primary Subject</label>
                        <input type="text" name="subject" class="form-control" value="{{ teacher['subject'] }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Experience (Yrs)</label>
                        <input type="number" name="experience" min="0" class="form-control" value="{{ teacher['experience'] }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Date of Joining</label>
                        <input type="date" name="date_of_joining" class="form-control" value="{{ teacher['date_of_joining'] }}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="3">{{ teacher['address'] }}</textarea>
                    </div>
                </div>
                <div class="mt-4 text-end">
                    <a href="{{ url_for('details') }}" class="btn btn-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-warning px-4"><i class="fa-solid fa-rotate me-1"></i> Update Record</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
